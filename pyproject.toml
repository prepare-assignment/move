[project]
name = "move"
version = "0.1.0"
description = "Move action for prepare assignment"
authors = [{ name = "Bonajo", email = "m.bonajo@fontys.nl" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prepare-toolbox>=1.0.1",
]

[dependency-groups]
test = [
    "pytest>=9.0.3",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.6.1",
    "packaging>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
