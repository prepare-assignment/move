name: Test

defaults:
  run:
    shell: bash

# Only on pull requests: main only changes through squash-merged PRs, which
# have already passed these checks.
on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    uses: prepare-assignment/actions-ci/.github/workflows/test.yml@main
    permissions:
      checks: write
      contents: read
      pull-requests: write
    with:
      mypy-argument: "move"